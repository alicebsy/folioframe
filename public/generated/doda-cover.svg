<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D8FEA"/>
      <stop offset="0.55" stop-color="#78B8F3"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
    <filter id="shadow" x="360" y="120" width="900" height="760" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#2469A6" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#paper)"/>
  <rect width="1600" height="1000" fill="url(#blue)" opacity="0.18"/>

  <!-- PDF 표지의 세로 블루 스트라이프와 사선 패턴을 응용한 배경 -->
  <g opacity="0.82">
    <rect x="0" width="190" height="1000" fill="#3195EC"/>
    <rect x="190" width="210" height="1000" fill="#56A4EE" opacity="0.78"/>
    <rect x="400" width="210" height="1000" fill="#76B5F1" opacity="0.62"/>
    <rect x="610" width="210" height="1000" fill="#8EC2F4" opacity="0.48"/>
    <rect x="820" width="210" height="1000" fill="#AED2F7" opacity="0.38"/>
    <rect x="1030" width="210" height="1000" fill="#C7E0F9" opacity="0.32"/>
    <rect x="1240" width="180" height="1000" fill="#DCEBFA" opacity="0.24"/>
    <rect x="1420" width="180" height="1000" fill="#EDF5FC" opacity="0.2"/>
    <path d="M170 0L400 300V560L170 260V0Z" fill="white" opacity="0.18"/>
    <path d="M520 150L820 540V800L520 410V150Z" fill="white" opacity="0.22"/>
    <path d="M910 0L1240 430V690L910 260V0Z" fill="white" opacity="0.28"/>
    <path d="M1250 250L1600 710V1000H1450L1250 740V250Z" fill="white" opacity="0.32"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="144" width="880" height="712" rx="28" fill="white" fill-opacity="0.97"/>
    <rect x="360" y="144" width="880" height="10" rx="5" fill="#2D8FEA"/>
    <text x="430" y="224" fill="#2D8FEA" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="5">U-KATHON · INFORMATION ACCESSIBILITY</text>
    <text x="430" y="310" fill="#26384A" font-family="Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-4">도다</text>
    <text x="430" y="360" fill="#58718B" font-family="Arial, sans-serif" font-size="25" font-weight="600">어려운 정보가, 필요한 사람에게 닿도록</text>

    <text x="420" y="510" fill="#2D8FEA" font-family="Georgia, serif" font-size="170" font-weight="700">“</text>
    <text x="518" y="505" fill="#26384A" font-family="Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-2">장애인 정보 접근성</text>
    <text x="520" y="566" fill="#26384A" font-family="Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-2">누구나 이해할 수 있게</text>
    <text x="1110" y="594" fill="#2D8FEA" font-family="Georgia, serif" font-size="150" font-weight="700">”</text>

    <line x1="430" y1="634" x2="1170" y2="634" stroke="#D8E8F8" stroke-width="2"/>
    <g transform="translate(430 680)">
      <rect width="210" height="92" rx="16" fill="#EEF7FF"/>
      <text x="22" y="38" fill="#2D8FEA" font-family="Arial, sans-serif" font-size="17" font-weight="800">01</text>
      <text x="22" y="68" fill="#26384A" font-family="Arial, sans-serif" font-size="22" font-weight="800">쉬운 뉴스</text>
    </g>
    <g transform="translate(670 680)">
      <rect width="210" height="92" rx="16" fill="#F1F8FF"/>
      <text x="22" y="38" fill="#2D8FEA" font-family="Arial, sans-serif" font-size="17" font-weight="800">02</text>
      <text x="22" y="68" fill="#26384A" font-family="Arial, sans-serif" font-size="22" font-weight="800">맞춤 복지</text>
    </g>
    <g transform="translate(910 680)">
      <rect width="260" height="92" rx="16" fill="#E7F3FF"/>
      <text x="22" y="38" fill="#2D8FEA" font-family="Arial, sans-serif" font-size="17" font-weight="800">03</text>
      <text x="22" y="68" fill="#26384A" font-family="Arial, sans-serif" font-size="22" font-weight="800">정보를 쉽게, 함께</text>
    </g>
  </g>

  <text x="86" y="914" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">DODA / MAKE INFORMATION REACHABLE</text>
  <text x="1512" y="914" text-anchor="end" fill="#2D6FAE" font-family="Arial, sans-serif" font-size="20" font-weight="700">2025 U-KATHON</text>
